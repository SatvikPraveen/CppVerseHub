name: Bug report
description: Report incorrect behaviour, a crash or a build failure
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected and what you observed instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, input and a minimal code sample if possible.
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: e.g. GCC 13.2, Clang 18.1, MSVC 19.40
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15, Windows 11
