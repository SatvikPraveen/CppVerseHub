name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc-13,   cxx: g++-13,     build_type: Release }
          - { os: ubuntu-24.04, compiler: gcc-14,   cxx: g++-14,     build_type: Debug }
          - { os: ubuntu-24.04, compiler: clang-18, cxx: clang++-18, build_type: Release }
          - { os: macos-15,     compiler: apple-clang, cxx: clang++, build_type: Release }
          - { os: windows-2022, compiler: msvc,     cxx: cl,         build_type: Release }
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCPPVERSEHUB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout 300

  sanitizers:
    name: sanitizer / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-18 -DCPPVERSEHUB_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build && pipx install gcovr
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build --preset coverage --parallel
      - run: ctest --preset coverage
      - name: Generate report
        run: >
          gcovr --root . --filter src/ --exclude-throw-branches
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --xml-pretty --output coverage.xml --print-summary
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset default -DCPPVERSEHUB_BUILD_TESTS=OFF -DCPPVERSEHUB_BUILD_EXAMPLES=OFF
      - run: cmake --build --preset default --parallel
      - run: cmake --build --preset default --target run_benchmarks
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: build/default/benchmark-results/*.json
