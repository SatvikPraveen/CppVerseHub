name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen graphviz
      - run: >
          cmake -S . -B build -G Ninja -DCPPVERSEHUB_BUILD_DOCS=ON
          -DCPPVERSEHUB_BUILD_TESTS=OFF -DCPPVERSEHUB_BUILD_BENCHMARKS=OFF -DCPPVERSEHUB_BUILD_EXAMPLES=OFF
      - run: cmake --build build --target docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
